<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Your Level Up</title>
  <style>
    :root{--ink:#06123e;--aqua:#1ba8bd;--sky:#e8f9fb;--lilac:#f0edff;--muted:#4d667e}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif;background:radial-gradient(circle at 9% 15%,#dff8fb,transparent 28%),radial-gradient(circle at 89% 86%,#e8e1ff,transparent 28%),linear-gradient(135deg,#fff 0%,#f4fcfd 52%,#f5f2ff 100%)}main{display:grid;min-height:100vh;place-items:center;padding:28px 18px}.card{width:min(700px,100%);padding:clamp(34px,7vw,68px);text-align:center;border:1px solid rgba(255,255,255,.95);border-radius:36px;background:rgba(255,255,255,.82);box-shadow:0 24px 58px rgba(4,38,79,.12)}.mark{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 23px;border-radius:23px;color:#fff;background:linear-gradient(135deg,#22b7c4,#148ca8);box-shadow:0 13px 24px rgba(27,168,189,.24);font-size:30px;font-weight:900}.eyebrow{margin:0 0 7px;color:#178da3;font-size:13px;font-weight:850;letter-spacing:.12em}h1{margin:0;font-size:clamp(96px,20vw,174px);line-height:.78;letter-spacing:-.1em}h2{max-width:500px;margin:30px auto 11px;font-size:clamp(27px,4vw,42px);line-height:1.05;letter-spacing:-.045em}.lead{max-width:480px;margin:0 auto;color:var(--muted);font-size:18px}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:31px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:13px 20px;border:2px solid transparent;border-radius:15px;font-weight:850;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}.button:hover{transform:translateY(-3px)}.primary{color:#fff;background:#1ba8bd;box-shadow:0 9px 17px rgba(27,168,189,.22)}.secondary{border-color:#c8e8ed;background:#fff;color:#168da4}.secondary:hover{box-shadow:0 9px 17px rgba(4,38,79,.1)}@media(max-width:490px){.card{border-radius:27px}.actions{flex-direction:column}.button{width:100%}.lead{font-size:16px}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <div class="mark" aria-hidden="true">↗</div>
      <p class="eyebrow">YOUR LEVEL UP</p>
      <h1 id="page-title">404</h1>
      <h2>Кажется, эта идея ушла в черновики</h2>
      <p class="lead">Ничего страшного: вернитесь на главную или напишите Виктории — поможем найти нужную страницу.</p>
      <div class="actions">
        <a class="button primary" href="https://yourlevelup.ru/">На главную</a>
        <a class="button secondary" href="https://vk.ru/mankovav" target="_blank" rel="noopener">Контакты Виктории ↗</a>
      </div>
    </section>
  </main>
</body>
</html>
